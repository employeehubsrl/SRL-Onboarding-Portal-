    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: Arial, sans-serif;

      height: 100%;
      overflow: hidden;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Zoom controls are removed */
  </style>
</head>
